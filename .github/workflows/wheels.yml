name: Wheels

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.11.24'
          python-version: '3.13'
      - name: Rust checks
        run: |
          uv python install 3.13
          export PYO3_PYTHON="$(uv python find 3.13)"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo +1.96.0 fmt --check
          cargo +1.96.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.96.0 test --locked
      - name: Python checks and portable backend
        env:
          PYTHONPATH: python
        run: |
          uvx --from ruff==0.16.9 ruff check .
          uvx --from ruff==0.16.9 ruff format --check .
          uv run --no-project --with 'pytest>=9,<10' python -B -m pytest -q

  wheels:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: auto
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.11.24'
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.96.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Install wheel with uv and require Rust on Python 3.13 and 3.14
        run: uv run --no-project python scripts/test_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + config['project']['version']
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
